name: mobile_app
description: "AIRA HRMS - Enterprise HR Management System Mobile Application"
publish_to: "none"
version: 1.0.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Network
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Storage
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5

  # Fonts
  google_fonts: ^6.2.1

  # Connectivity
  connectivity_plus: ^6.1.1

  # Animations (Lottie JSON — 404 / no-internet screens)
  lottie: ^3.1.3

  # File / Image picking
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Location (attendance clock-in geofencing)
  geolocator: ^13.0.1

  # URL launching (preview / download)
  url_launcher: ^6.3.0

  # Voice commands — native speech-to-text capture; spoken replies are
  # synthesized server-side (POST /voice/speak/, bilingual EN/HI Sarvam
  # Bulbul TTS) and played back locally via audioplayers, not
  # flutter_tts — backend is the single source of truth for which language
  # to reply in, and an on-device English-only TTS engine can't speak Hindi.
  speech_to_text: ^7.0.0
  # Fixed-duration mic re-capture for the Hindi-STT fallback retry
  # (POST /voice/transcribe-fallback/) — records a short WAV clip when a
  # voice-sourced transcript comes back as a final no_match.
  record: ^7.1.1
  # Local playback of the raw audio/wav bytes POST /voice/speak/ returns.
  audioplayers: ^6.8.1

  # Face ID registration/verification — live camera preview + capture,
  # on-device face detection for liveness cues (blink / head-turn), and a
  # bundled on-device embedding model (MobileFaceNet, assets/models/
  # mobilefacenet.tflite) — see features/facial_recognition. There is no
  # backend endpoint for computing embeddings server-side, so the whole
  # capture pipeline runs on-device end to end; the embedding is NOT
  # numerically compatible with the web app's face-api.js embeddings (a
  # different model entirely) — an employee must register and verify on the
  # same platform.
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.1
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/animations/

# Config for `dart run flutter_native_splash:create` — generates the native
# (pre-Flutter-engine) launch screen shown the instant the app icon is
# tapped, before Dart even starts running.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.png
